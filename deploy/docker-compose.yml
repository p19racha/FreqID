# Production Docker Compose Stack for FreqID

services:
  # ----------------------------------------------------------------------------
  # Ingress Reverse Proxy & Automatic TLS Termination
  # ----------------------------------------------------------------------------
  proxy:
    image: caddy:2.8.4-alpine
    container_name: freqid-proxy
    restart: unless-stopped
    ports:
      - "${FREQID_HTTP_PORT:-80}:80"
      - "${FREQID_HTTPS_PORT:-443}:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./tls/certs:/etc/ssl/certs:ro
    networks:
      - frontend
    depends_on:
      server:
        condition: service_healthy
      admin-ui:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # ----------------------------------------------------------------------------
  # Static Web Dashboard for Administration
  # ----------------------------------------------------------------------------
  admin-ui:
    image: freqid/admin-ui:${FREQID_VERSION:-0.1.0}
    container_name: freqid-admin-ui
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=16m
    user: "101:101"
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ----------------------------------------------------------------------------
  # Biometric Inference & Matching Server (FastAPI / Uvicorn)
  # ----------------------------------------------------------------------------
  server:
    image: freqid/server:${FREQID_VERSION:-0.1.0}
    container_name: freqid-server
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    user: "${FREQID_UID:-1000}:${FREQID_GID:-1000}"
    environment:
      FREQID_SERVER_ENVIRONMENT: ${FREQID_SERVER_ENVIRONMENT:-production}
      FREQID_SERVER_HOST: 0.0.0.0
      FREQID_SERVER_PORT: 8000
      FREQID_SERVER_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-freqid}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-freqid}
      FREQID_SERVER_STORAGE_BACKEND: postgres
      FREQID_SERVER_MASTER_KEY_FILE: /run/secrets/master_key
      FREQID_SERVER_MODEL_BACKEND: ${FREQID_SERVER_MODEL_BACKEND:-onnx}
      FREQID_SERVER_MODEL_PATH: ${FREQID_SERVER_MODEL_PATH:-/app/models/partialface_ir_18.onnx}
      FREQID_SERVER_DEVICE: ${FREQID_SERVER_DEVICE:-cpu}
      FREQID_SERVER_DECISION_THRESHOLD: ${FREQID_SERVER_DECISION_THRESHOLD:-0.35}
      FREQID_SERVER_MASK_SCORES_IN_PRODUCTION: ${FREQID_SERVER_MASK_SCORES_IN_PRODUCTION:-true}
      FREQID_SERVER_RATE_LIMIT_PER_MINUTE: ${FREQID_SERVER_RATE_LIMIT_PER_MINUTE:-120}
      FREQID_SERVER_MAX_INFERENCE_WORKERS: ${FREQID_SERVER_MAX_INFERENCE_WORKERS:-4}
    volumes:
      - ./models:/app/models:ro
    secrets:
      - master_key
      - jwt_secret
    networks:
      - frontend
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').getcode() == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ----------------------------------------------------------------------------
  # PostgreSQL Persistence Database (Isolated Backend Network Only)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: freqid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freqid}
      POSTGRES_USER: ${POSTGRES_USER:-freqid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-freqid} -d ${POSTGRES_DB:-freqid}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    security_opt:
      - no-new-privileges:true

  # ----------------------------------------------------------------------------
  # Schema Migration Service (One-Off Alembic Job on Stack Startup)
  # ----------------------------------------------------------------------------
  migrate:
    image: freqid/server:${FREQID_VERSION:-0.1.0}
    container_name: freqid-migrate
    entrypoint: ["alembic", "upgrade", "head"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    user: "${FREQID_UID:-1000}:${FREQID_GID:-1000}"
    environment:
      FREQID_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-freqid}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-freqid}
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  caddy_data:
    name: freqid_caddy_data
  caddy_config:
    name: freqid_caddy_config
  postgres_data:
    name: freqid_postgres_data

networks:
  frontend:
    name: freqid_frontend
    driver: bridge
  backend:
    name: freqid_backend
    driver: bridge
    internal: true

secrets:
  master_key:
    file: ./secrets/master.key
  jwt_secret:
    file: ./secrets/jwt_secret.txt

