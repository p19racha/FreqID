# Nginx Hardened Reverse Proxy Configuration: TLS 1.3 Only & Optional mTLS

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name freqid.internal;

    # Server TLS Certificates
    ssl_certificate /etc/ssl/certs/freqid_server.crt;
    ssl_certificate_key /etc/ssl/private/freqid_server.key;

    # Enforce TLS 1.3 Minimum Protocol
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    # TLS 1.3 Modern Cipher Suites (RFC 8446)
    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;

    # SSL Session Cache & Lifetime
    ssl_session_timeout 1d;
    ssl_session_cache shared:FreqIDSSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Optional Mutual TLS (mTLS) for Edge Hardware
    # Uncomment when edge devices authenticate via X.509 client certificates
    # ssl_client_certificate /etc/ssl/certs/freqid_internal_ca.crt;
    # ssl_verify_client optional;
    # ssl_verify_depth 2;

    # Proxy to FreqID FastAPI Application
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Forwarded Client Identity
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward mTLS Client Details to Application
        proxy_set_header X-Client-Cert-Verify $ssl_client_verify;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;

        # Buffer & Timeout Constraints
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 10M;
    }
}
