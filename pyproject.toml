[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "recognition",
    "quality",
    "security",
    "attribute",
    "research",
    "backend/alembic",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # Line length is handled by formatter
    "E402",  # Module level import not at top of file
    "E712",  # Avoid equality comparisons to True/False (SQLAlchemy query expressions)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"backend/alembic/*" = ["ALL"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
