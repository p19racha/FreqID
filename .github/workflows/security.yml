name: Security & Privacy Audit

on:
  push:
    branches:
      - master
      - main
      - freqid-dev
      - phase9-release
  pull_request:
    branches:
      - master
      - main
      - freqid-dev
  schedule:
    - cron: "0 4 * * 1" # Weekly Monday at 04:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Repository Safety & Secret Leakage Scanner
  # ============================================================================
  repo-safety-scan:
    name: Repository Safety & Secret Leak Scanner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute repository hygiene scanner
        run: |
          python scripts/precommit_check.py --all

  # ============================================================================
  # 2. Strict Zero-Camera Invariant Enforcement
  # ============================================================================
  zero-camera-audit:
    name: Zero-Camera Invariant Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute AST camera inspection
        run: |
          node admin-ui/scripts/check-no-camera.js

  # ============================================================================
  # 3. Dependency Vulnerability Audits
  # ============================================================================
  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@10.27.0

      - name: Audit npm production dependencies
        run: |
          cd admin-ui && pnpm audit --prod --audit-level=high || echo "[!] npm audit completed with advisories"

      - name: Audit Python dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip install -e "./core[all]" -e "./client-sdk[all]" -e "./backend[all]"
          pip-audit --desc || echo "[!] pip-audit completed with advisories"
