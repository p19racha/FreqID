name: Release Automation

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  publish-release:
    name: Build & Publish Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release version
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push freqid-server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/freqid-server:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/freqid-server:latest

      - name: Build and push freqid-admin-ui
        uses: docker/build-push-action@v5
        with:
          context: admin-ui
          file: admin-ui/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/freqid-admin-ui:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/freqid-admin-ui:latest

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "FreqID ${{ steps.meta.outputs.tag }}" \
            --generate-notes \
            --draft=false \
            --prerelease=false
